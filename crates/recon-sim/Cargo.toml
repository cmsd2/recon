[package]
name = "recon-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# Storage does not survive a restart. Off in every normal build; `scripts/check-durability-tests.sh`
# turns it on to ask which tests would notice. See `Sim::restart`.
lose-storage-on-restart = []

[dependencies]
recon-core = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
tracing-subscriber = { workspace = true }
